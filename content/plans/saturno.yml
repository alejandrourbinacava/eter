#   query     el sujeto concreto, para los archivos científicos (NASA SVS, NASA)
#   generic   cuatro descripciones para los bancos de stock, sin nombres propios
#   emphasis  la frase de remate sobre la que cae el golpe de sonido. Tiene que
#             aparecer LITERAL en la escena; si no, se descarta el golpe.
#
# Las genéricas van escritas para engancharse con la biblioteca propia: hay
# cuatro clips de Saturno en library/saturn (Hubble+Webb 2024, temporada de
# radios, pan sobre el planeta, animación de su luna) y cuatro de planetas en
# library/planets. Por eso repiten palabras como saturn, planet, rings y clouds:
# el indexador empareja por esas etiquetas.

title: Por Qué Es Imposible Aterrizar En Saturno
thumb_word: IMPOSIBLE
keyword: saturn rings cassini
thumb_prompt: >-
  Saturn seen up close from just above its cloud tops, the rings cutting
  diagonally across the frame, a tiny spacecraft silhouette falling into the
  yellow banded atmosphere, dramatic and photorealistic on black
description: |-
  🪐 Saturno es el planeta que cualquiera sabe dibujar: un círculo y un anillo. Lo hemos orbitado trece años, contado 274 lunas y medido sus vientos. Y aun así hay una pregunta que nadie hace.

  🌀 ¿Dónde se posaría exactamente una nave? No hay respuesta. Saturno no tiene suelo: es hidrógeno que se vuelve más denso hasta convertirse en metal líquido, y su único núcleo sólido está a cincuenta mil kilómetros de profundidad y a 11.700 grados.

  ⏱️ Cassini aguantó cerca de un minuto al intentar bajar. El récord de la humanidad en un gigante gaseoso son 58 minutos, en Júpiter. Aterrizar allí no es difícil: es que la palabra no significa nada.
