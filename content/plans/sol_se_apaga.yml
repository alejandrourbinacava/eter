# Plan visual de «Qué Pasaría Si El Sol Se Apagara De Repente».
#
#   query     el sujeto concreto, para los archivos científicos (NASA SVS, NASA)
#   generic   cuatro descripciones para los bancos de stock, sin nombres propios
#   emphasis  la frase de remate sobre la que cae el golpe de sonido. Tiene que
#             aparecer LITERAL en la escena; si no, se descarta el golpe.
#
# Los índices se corresponden con `python scripts/from_script.py guion.md --scenes`
# y son estables porque el troceado es determinista.

title: Qué Pasaría Si El Sol Se Apagara De Repente
thumb_word: OSCURIDAD
keyword: sun solar surface
thumb_prompt: >-
  The Sun going dark seen from Earth orbit, half the solar disc already black,
  the terminator line racing across a blue planet below
description: |-
  ☀️ El Sol lleva ardiendo cuatro mil seiscientos millones de años sin una sola
  interrupción. Está tan integrado en cada segundo de tu vida que ni siquiera lo
  consideras una variable.

  🌑 Si se apagara ahora mismo, no lo sabrías durante ocho minutos. Seguirías
  viendo la luz de una estrella que ya no existe.

  🧊 Y ocho minutos y un segundo después, la Tierra dejaría de orbitar nada.
tags:
  - sol
  - qué pasaría si
  - sistema solar
  - astronomía
  - espacio
  - fotosíntesis
  - glaciación
  - documental espacial
  - ciencia
  - universo
  - estrella
  - tierra
  - divulgación científica
  - física
  - curiosidades del espacio

