# Cola de temas de Éter.
#
# El pipeline coge el primero que no esté en content/published.json, lo publica
# y lo marca como usado. Cuando quedan menos de MIN_BACKLOG temas sin usar, el
# generador de guiones propone temas nuevos y los añade al final de este fichero
# (el commit lo hace el propio workflow).
#
# Campos:
#   title_hint  pista de título; el generador puede reescribirlo
#   angle       la anomalía concreta que sostiene el vídeo. Sin esto no hay vídeo.
#   keyword     término de búsqueda visual principal (en inglés, para los archivos)
#   thumb_word  palabra única de la miniatura, mayúsculas, 5-10 letras

topics:
  - title_hint: El Planeta Que Llueve Cristal A 7.000 Kilómetros Por Hora
    angle: HD 189733b tiene una atmósfera de silicatos; los vientos supersónicos convierten la lluvia en cuchillas de vidrio.
    keyword: exoplanet atmosphere
    thumb_word: CRISTAL

  - title_hint: La Estrella Que Desapareció y NO Sabemos Dónde Está
    angle: En 2019 una supergigante de la galaxia de Kinman dejó de verse sin explosión previa; pudo colapsar directamente en agujero negro.
    keyword: supergiant star
    thumb_word: DESAPARECIÓ

  - title_hint: Por Qué El Núcleo De La Tierra Se Está Frenando
    angle: El núcleo interno rotaba más rápido que la superficie y desde 2009 se ha invertido; nadie sabe qué implica a largo plazo.
    keyword: earth core
    thumb_word: FRENANDO

  - title_hint: La Nube De Oort, El Límite Que Ninguna Sonda Cruzará
    angle: Voyager 1 tardará 300 años en llegar a su borde interior y 30.000 en atravesarla; el sistema solar es mil veces mayor de lo que enseñan.
    keyword: oort cloud comet
    thumb_word: LÍMITE

  - title_hint: El Océano De Europa Tiene Más Agua Que Toda La Tierra
    angle: Bajo 15-25 km de hielo hay un océano salado de 100 km de profundidad, con el doble de agua líquida que el planeta entero.
    keyword: europa jupiter moon
    thumb_word: OCÉANO

  - title_hint: ¿Qué Pasa Si Dos Agujeros Negros Chocan Cerca De La Tierra?
    angle: La fusión libera más energía en un segundo que todas las estrellas del universo observable juntas, pero en forma de ondas gravitacionales.
    keyword: black hole merger
    thumb_word: CHOQUE

  - title_hint: La Mancha Roja De Júpiter Se Está Muriendo
    angle: La tormenta lleva al menos 350 años activa y en un siglo ha encogido a la mitad; no hay modelo que explique ni su duración ni su final.
    keyword: jupiter great red spot
    thumb_word: MURIENDO

  - title_hint: El Lugar Más Frío Del Universo No Está En El Espacio
    angle: La nebulosa Boomerang está a 1 K, más fría que el fondo cósmico; pero el récord absoluto se ha batido en un laboratorio terrestre.
    keyword: boomerang nebula
    thumb_word: FRÍO

  - title_hint: Por Qué Venus Es El Planeta Que Más Se Parecía A La Tierra
    angle: Pudo tener océanos durante 2.000 millones de años; algo desencadenó un efecto invernadero desbocado y nadie sabe qué.
    keyword: venus surface
    thumb_word: GEMELO

  - title_hint: La Señal Wow, 47 Años Después Seguimos Sin Explicarla
    angle: 72 segundos de banda estrecha en 1420 MHz que nunca se repitió; todas las explicaciones naturales propuestas han sido descartadas o son parciales.
    keyword: radio telescope array
    thumb_word: SEÑAL

  - title_hint: El Viaje De La Luz Que Tarda Un Millón De Años En Salir Del Sol
    angle: Un fotón generado en el núcleo tarda entre 10.000 y un millón de años en alcanzar la superficie, y 8 minutos en llegar a tus ojos.
    keyword: sun solar surface
    thumb_word: ATRAPADA

  - title_hint: Titán Es El Único Sitio Del Sistema Solar Con Ríos Además De La Tierra
    angle: Ríos, lagos y lluvia de metano líquido a -179 °C, con un ciclo hidrológico completo que no usa agua.
    keyword: titan saturn moon
    thumb_word: RÍOS

  - title_hint: Lo Que Le Pasaría A Tu Cuerpo En El Vacío Del Espacio
    angle: No explotas ni te congelas al instante; pierdes la consciencia en 15 segundos por la ebullición de los fluidos a presión cero.
    keyword: astronaut spacewalk
    thumb_word: VACÍO

  - title_hint: La Materia Oscura Es El 85 % Del Universo y No Sabemos Qué Es
    angle: Se detecta solo por su gravedad; 40 años de experimentos directos no han encontrado ni una sola partícula.
    keyword: galaxy cluster dark matter
    thumb_word: INVISIBLE

  - title_hint: El Asteroide Que Vale Más Que La Economía Mundial
    angle: 16 Psyche es probablemente el núcleo metálico expuesto de un protoplaneta destruido; su valor mineral no tiene sentido económico real.
    keyword: asteroid psyche metal
    thumb_word: METAL

  - title_hint: Por Qué La Luna Se Está Alejando De Nosotros
    angle: 3,8 cm al año por transferencia de momento angular; en 600 millones de años no habrá más eclipses totales de Sol.
    keyword: moon earth orbit
    thumb_word: ALEJÁNDOSE

  - title_hint: El Motor Que Podría Llevarnos A Otra Estrella
    angle: Propulsión nuclear de pulso, velas láser y antimateria; los tres funcionan sobre el papel y los tres son inviables por razones distintas.
    keyword: interstellar spacecraft
    thumb_word: IMPOSIBLE

  - title_hint: La Atmósfera De Marte Se La Llevó El Viento Solar
    angle: Sin campo magnético global, Marte perdió su aire durante miles de millones de años; MAVEN midió la fuga en tiempo real.
    keyword: mars atmosphere
    thumb_word: ROBADA

  - title_hint: ¿Cuánto Duraría La Vida En La Tierra Sin El Campo Magnético?
    angle: Las inversiones geomagnéticas ocurren cada 200.000-300.000 años y llevamos 780.000 sin una; el campo se ha debilitado un 9 % en 200 años.
    keyword: earth magnetic field aurora
    thumb_word: ESCUDO

  - title_hint: El Gran Atractor, Algo Tira De Nuestra Galaxia y No Podemos Verlo
    angle: La Vía Láctea cae hacia un punto a 250 millones de años luz oculto tras el plano galáctico, a 600 km/s.
    keyword: galaxy supercluster
    thumb_word: ATRACTOR
