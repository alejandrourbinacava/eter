name: Publicación diaria

on:
  schedule:
    # Arranca a las 6:00 de Madrid, todo el año. El render tarda unos 95
    # minutos, así que el vídeo está subido en privado sobre las 7:35 y a
    # las 8 ya se puede revisar, que es lo que se pidió.
    #
    # El cron de GitHub solo entiende UTC y no sabe nada del horario de verano,
    # así que una sola entrada se desfasaría una hora medio año: Madrid es UTC+1
    # en invierno y UTC+2 en verano. Se disparan las dos horas posibles y el
    # primer paso del trabajo corta la que no toca.
    #
    # Nunca en la hora en punto: es cuando GitHub tiene más cola y es lo
    # primero que descarta. Medido en este repo, un disparo a las 15:00 se
    # ejecutó a las 17:04.
    - cron: "17 3 * * *"
    - cron: "17 4 * * *"
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renderizar sin publicar"
        type: boolean
        default: false
      subir:
        description: "Subir a YouTube (requiere los secretos YT_*)"
        type: boolean
        default: false
      privacy:
        description: "Visibilidad, solo si se sube"
        type: choice
        options: [private, unlisted, public]
        default: private
      minutes:
        description: "Duración objetivo en minutos"
        default: "14"

# Nunca dos renders a la vez: compartirían cuota de API y historial.
concurrency:
  group: eter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Un vídeo de 20 min tardó 75 en un equipo de 16 núcleos; el runner tiene 4.
    # El techo de GitHub son 360 minutos y no se puede subir.
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - name: ¿Toca trabajar?
        id: hora
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          HOY=$(TZ=Europe/Madrid date +%F)
          echo "En Madrid son las $H:00 del $HOY"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano, se continúa."
            echo "sigue=si" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Ventana, no hora exacta: GitHub retrasa las tareas programadas y
          # con una comparación exacta un disparo tardío se tiraba a la basura.
          if [ "$H" -lt 6 ] || [ "$H" -gt 10 ]; then
            echo "Fuera de la ventana 6:00-10:59; se descarta."
            echo "sigue=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Como ahora hay tres disparos y una ventana ancha, lo que evita el
          # vídeo duplicado es el historial, no el reloj.
          if [ -f content/published.json ] && grep -q "\"$HOY\"" content/published.json; then
            echo "Ya hay un vídeo con fecha $HOY; se descarta."
            echo "sigue=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "sigue=si" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.sigue == 'si'
        with:
          python-version: "3.12"
          cache: pip

      - name: Hacer sitio en el disco
        if: steps.hora.outputs.sigue == 'si'
        run: |
          # El runner viene con ~14 GB libres y una producción sin limpiar
          # ocupa 6,7. Quitando las imágenes de Android y .NET se ganan 20 GB.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h / | tail -1

      - name: Instalar ffmpeg
        if: steps.hora.outputs.sigue == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        if: steps.hora.outputs.sigue == 'si'
        run: pip install -r requirements.txt

      - name: Cachear la tipografía de marca
        if: steps.hora.outputs.sigue == 'si'
        uses: actions/cache@v4
        with:
          path: brand/fonts
          key: eter-fonts-v1

      - name: Producir y publicar
        if: steps.hora.outputs.sigue == 'si'
        env:
          # Vale con cualquiera de los dos nombres.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # El cron sube SIEMPRE en privado: el vídeo aparece cada mañana
          # en el canal listo para revisar, y publicarlo es un clic. Solo un
          # lanzamiento a mano puede pedir otra visibilidad.
          ETER_PRIVACY: ${{ inputs.privacy || 'private' }}
          ETER_TARGET_MINUTES: ${{ inputs.minutes || '14' }}
        run: |
          # En bash y no en una expresión de GitHub: allí la cadena vacía es
          # falsa, así que "subir" caía en la rama del || y nunca subía.
          if   [ "${{ inputs.dry_run }}" = "true" ]; then MODO="--dry-run"
          elif [ "${{ inputs.subir }}"   = "true" ]; then MODO=""
          else                                            MODO="--no-upload"
          fi
          echo "Modo: ${MODO:-subir a YouTube}"
          python -m pipeline.run $MODO

      - name: Espacio restante
        if: always() && steps.hora.outputs.sigue == 'si'
        run: df -h / | tail -1

      - name: Guardar guion, miniatura y subtítulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eter-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: ignore
          # El MP4 va por Releases, no por aquí: los artefactos consumen la
          # cuota de almacenamiento de la cuenta —500 MB en el plan gratuito,
          # que un solo vídeo casi agota— y hacer público el repositorio libera
          # los minutos pero no el almacenamiento.
          path: |
            build/**/guion.txt
            build/**/plan.json
            build/**/miniatura.jpg
            build/**/descripcion.txt
            build/**/subtitulos.srt

      - name: Publicar el vídeo como release
        if: success() && steps.hora.outputs.sigue == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO=$(find build -name video.mp4 | head -1)
          if [ -z "$VIDEO" ]; then
            echo "No se ha producido ningún vídeo."; exit 1
          fi
          DIR=$(dirname "$VIDEO")
          TAG="video-$(TZ=Europe/Madrid date +%Y%m%d-%H%M)"
          TITULO=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['title'])" "$DIR/plan.json")
          echo "Publicando «$TITULO» en $TAG ($(du -h "$VIDEO" | cut -f1))"
          gh release create "$TAG"             "$VIDEO" "$DIR/miniatura.jpg" "$DIR/subtitulos.srt" "$DIR/descripcion.txt"             --title "$TITULO" --notes-file "$DIR/descripcion.txt"

      - name: Registrar la publicación en el repositorio
        if: success() && !inputs.dry_run && steps.hora.outputs.sigue == 'si'
        run: |
          git config user.name  "eter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que registrar."
          else
            LAST=$(python -c "import json;d=json.load(open('content/published.json',encoding='utf-8'));print(d[-1]['title'])")
            git commit -m "Publica: $LAST"
            # El render dura hora y media y en ese rato main puede haber
            # avanzado. Sin esto el push se rechaza y el tema no queda marcado,
            # con lo que al día siguiente se repetiría el mismo vídeo.
            for intento in 1 2 3; do
              git push && exit 0
              echo "Push rechazado (intento $intento); rebase sobre main y reintento."
              git pull --rebase --autostash origin main || exit 1
            done
            echo "No se ha podido registrar tras 3 intentos."; exit 1
          fi
