name: Publicación diaria

on:
  schedule:
    # Las 6:00 de Madrid, todo el año.
    #
    # El cron de GitHub solo entiende UTC y no sabe nada del horario de verano,
    # así que una sola entrada se desfasaría una hora medio año: Madrid es UTC+1
    # en invierno y UTC+2 en verano. Se disparan las dos horas posibles y el
    # primer paso del trabajo corta la que no toca.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renderizar sin publicar"
        type: boolean
        default: false
      privacy:
        description: "Visibilidad del vídeo"
        type: choice
        options: [public, unlisted, private]
        default: public
      minutes:
        description: "Duración objetivo en minutos"
        default: "14"

# Nunca dos renders a la vez: compartirían cuota de API y historial.
concurrency:
  group: eter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Un vídeo de 20 min tardó 75 en un equipo de 16 núcleos; el runner tiene 4.
    # El techo de GitHub son 360 minutos y no se puede subir.
    timeout-minutes: 340

    steps:
      - name: ¿Son las 6 en Madrid?
        id: hora
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          echo "En Madrid son las $H:00"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano, se continúa."
            echo "sigue=si" >> "$GITHUB_OUTPUT"
          elif [ "$H" = "06" ]; then
            echo "sigue=si" >> "$GITHUB_OUTPUT"
          else
            echo "No son las 6 en Madrid; este disparo se descarta."
            echo "sigue=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.sigue == 'si'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.sigue == 'si'
        with:
          python-version: "3.12"
          cache: pip

      - name: Hacer sitio en el disco
        if: steps.hora.outputs.sigue == 'si'
        run: |
          # El runner viene con ~14 GB libres y una producción sin limpiar
          # ocupa 6,7. Quitando las imágenes de Android y .NET se ganan 20 GB.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h / | tail -1

      - name: Instalar ffmpeg
        if: steps.hora.outputs.sigue == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        if: steps.hora.outputs.sigue == 'si'
        run: pip install -r requirements.txt

      - name: Cachear la tipografía de marca
        if: steps.hora.outputs.sigue == 'si'
        uses: actions/cache@v4
        with:
          path: brand/fonts
          key: eter-fonts-v1

      - name: Producir y publicar
        if: steps.hora.outputs.sigue == 'si'
        env:
          # Vale con cualquiera de los dos nombres.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ETER_PRIVACY: ${{ inputs.privacy || 'public' }}
          ETER_TARGET_MINUTES: ${{ inputs.minutes || '14' }}
        run: |
          python -m pipeline.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Espacio restante
        if: always() && steps.hora.outputs.sigue == 'si'
        run: df -h / | tail -1

      - name: Guardar guion, miniatura y subtítulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eter-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          # En una publicación normal el MP4 se queda fuera: ya está en YouTube
          # y ocupa cientos de megas de almacenamiento de artefactos. Pero en
          # seco no se sube a ningún sitio, así que sin él la ejecución no
          # devuelve lo único que se quería mirar.
          path: |
            ${{ inputs.dry_run && 'build/**/video.mp4' || '' }}
            build/**/guion.txt
            build/**/plan.json
            build/**/miniatura.jpg
            build/**/descripcion.txt
            build/**/subtitulos.srt

      - name: Registrar la publicación en el repositorio
        if: success() && !inputs.dry_run && steps.hora.outputs.sigue == 'si'
        run: |
          git config user.name  "eter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que registrar."
          else
            LAST=$(python -c "import json;d=json.load(open('content/published.json',encoding='utf-8'));print(d[-1]['title'])")
            git commit -m "Publica: $LAST"
            git push
          fi
