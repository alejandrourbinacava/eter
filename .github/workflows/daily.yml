name: Publicación diaria

on:
  schedule:
    # 15:00 UTC — el render tarda 20-40 min, así que el vídeo aparece
    # alrededor de las 17:30-18:00 en Madrid, la franja del canal.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renderizar sin publicar"
        type: boolean
        default: false
      privacy:
        description: "Visibilidad del vídeo"
        type: choice
        options: [public, unlisted, private]
        default: public
      minutes:
        description: "Duración objetivo en minutos"
        default: "14"

# Nunca dos renders a la vez: compartirían cuota de API y historial.
concurrency:
  group: eter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cachear la tipografía de marca
        uses: actions/cache@v4
        with:
          path: brand/fonts
          key: eter-fonts-v1

      - name: Producir y publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ETER_PRIVACY: ${{ inputs.privacy || 'public' }}
          ETER_TARGET_MINUTES: ${{ inputs.minutes || '14' }}
        run: |
          python -m pipeline.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Guardar guion, miniatura y subtítulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eter-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          # El MP4 se queda fuera a propósito: ya está en YouTube y ocupa
          # cientos de megas en el almacenamiento de artefactos.
          path: |
            build/**/guion.txt
            build/**/plan.json
            build/**/miniatura.jpg
            build/**/descripcion.txt
            build/**/subtitulos.srt

      - name: Registrar la publicación en el repositorio
        if: success() && !inputs.dry_run
        run: |
          git config user.name  "eter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json content/topics.yml
          if git diff --staged --quiet; then
            echo "Sin cambios que registrar."
          else
            LAST=$(python -c "import json;d=json.load(open('content/published.json',encoding='utf-8'));print(d[-1]['title'])")
            git commit -m "Publica: $LAST"
            git push
          fi
